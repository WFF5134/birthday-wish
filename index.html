<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生日快乐 ♡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23FF6B9D' d='M12 21s-7.5-4.9-10-9.2C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z'/></svg>">
<style>
  :root{
    --bg-1:#2A1836; --bg-2:#171024; --bg-3:#0E0A18;
    --pink:#FF6B9D; --pink-soft:#FF8FB1; --cream:#FFF5F7; --sub:#E8B9C9;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(ellipse 70% 45% at 50% 18%, rgba(120,70,140,.35) 0%, rgba(120,70,140,0) 70%),
      radial-gradient(ellipse 80% 50% at 50% 92%, rgba(50,70,140,.30) 0%, rgba(50,70,140,0) 70%),
      radial-gradient(ellipse at 50% 32%, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    color:var(--cream);
  }
  #scene{ position:fixed; inset:0; display:block; }

  /* ===== 满屏祝福弹窗层 ===== */
  #popups{ position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
  .pop{
    position:absolute; padding:8px 14px; border-radius:14px;
    font-size:14px; color:#4A3644; white-space:nowrap;
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 3px 12px rgba(20,10,30,.22);
    opacity:0; transform:scale(.6);
    transition:opacity .4s ease, transform .4s cubic-bezier(.22,1,.36,1);
  }
  .pop.in{ opacity:.95; transform:scale(1); }
  .pop.float{ animation:popFloat 3.2s ease-in-out infinite; }
  @keyframes popFloat{ 0%,100%{ margin-top:0; } 50%{ margin-top:-8px; } }

  /* ===== 祝福文案层 ===== */
  .greeting{
    position:fixed; top:4%; left:0; right:0;
    text-align:center; pointer-events:none; z-index:7;
    opacity:0; transform:translateY(18px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(0.22,1,0.36,1);
    padding:0 20px;
  }
  .greeting.show{ opacity:1; transform:translateY(0); }
  .greeting .name{
    font-size:clamp(18px, 3.2vw, 26px);
    font-weight:700; letter-spacing:0.18em;
    color:var(--pink-soft);
    text-shadow:0 0 18px rgba(255,143,177,.5), 0 2px 8px rgba(0,0,0,.35);
    margin-bottom:6px;
  }
  .greeting h1{
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-size:clamp(28px, 5.4vw, 46px);
    font-weight:800; letter-spacing:0.06em;
    color:var(--cream);
    text-shadow:0 0 24px rgba(255,107,157,.55), 0 2px 10px rgba(0,0,0,.4);
  }
  .heart-ico{ width:0.9em; height:0.9em; flex:none; color:var(--cream); }
  .greeting p{
    margin-top:8px;
    font-size:clamp(13px, 2.2vw, 16px);
    letter-spacing:0.12em; color:var(--sub);
    text-shadow:0 1px 6px rgba(0,0,0,.45);
  }

  /* ===== 右下角控制按钮 ===== */
  .controls{
    position:fixed; right:16px; bottom:16px; display:flex; gap:10px; z-index:10;
  }
  .controls button{
    appearance:none; border:1px solid rgba(255,143,177,.45);
    background:rgba(30,18,40,.55); color:var(--pink-soft);
    font-family:inherit; font-size:14px; letter-spacing:0.05em;
    padding:9px 16px; border-radius:999px; cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .controls button:hover{ background:rgba(255,107,157,.18); transform:translateY(-1px); }
  .controls button:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }

  @media (max-width:480px){
    .greeting{ top:5%; }
    .controls{ right:10px; bottom:10px; gap:8px; }
    .controls button{ padding:8px 13px; font-size:13px; }
    .pop{ font-size:12px; padding:6px 11px; border-radius:12px; white-space:normal; max-width:38%; line-height:1.35; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="popups"></div>

<div class="greeting" id="greeting">
  <div class="name" id="nameLine">张彬铃小朋友</div>
  <h1 id="title">
    <svg class="heart-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>生日快乐</span>
    <svg class="heart-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </h1>
  <p id="subtitle">愿你新的一岁，继续闪闪发光</p>
</div>

<div class="controls">
  <button id="btnReplay" type="button">重播</button>
  <button id="btnMusic" type="button">音乐 开</button>
  <button id="btnFull" type="button">全屏</button>
</div>

<script>
(function(){
  "use strict";

  /* ================= 可配置项 ================= */
  // 想写名字：页面地址后加 ?name=某某，例如 生日祝福爱心.html?name=小美
  var params = new URLSearchParams(location.search);
  var NAME = (params.get("name") || "张彬铃小朋友").trim();
  var SUBTITLE = "愿你新的一岁，继续闪闪发光";

  var BLESSINGS = [
    "天天开心", "万事顺意", "平安喜乐", "心想事成",
    "所愿皆成真", "好运常伴", "未来越来越好", "被世界温柔以待",
    "好好吃饭", "保持好心情", "顺顺利利", "别熬夜",
    "天凉多穿衣", "今天你最大", "要继续闪闪发光", "我想你了"
  ];
  var POP_COLORS = ["#FFE3EE", "#E3F2FF", "#FFF6D6", "#DFF7EC", "#EFE3FF", "#FFE0F7"];

  var HEART_COLORS = ["#FF6B9D", "#FF8FB1", "#FFA6C1", "#F75C8A", "#FFC2D4"];
  var SPARK_COLORS = ["#FFD166", "#7CC4FF", "#B98CFF", "#7CE8C6", "#FF8A8A", "#FFF3B0"];
  var BALLOON_COLORS = ["#FF6B9D", "#FFD166", "#7CC4FF", "#B98CFF", "#7CE8C6", "#FF8A8A", "#FFA6C1"];

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= 画布与尺寸 ================= */
  var cvs = document.getElementById("scene");
  var ctx = cvs.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var isNarrow = false;

  /* ================= 场景对象 ================= */
  var stars = [];
  var floaters = [];
  var balloons = [];
  var heartPts = [];
  var cakePts = [];     // 粒子彩虹阶梯蛋糕散点
  var sparks = [];      // 火焰上方金色火花
  var tags = [];
  var popCards = [];

  var layout = {};

  function heartRaw(i, n){
    var t = 2 * Math.PI * i / n;
    var s = Math.sin(t);
    var x = 16 * s * s * s;
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: y };
  }

  function buildStatic(){
    var i, p;
    heartPts = [];
    var N = 90;
    for (i = 0; i < N; i++){
      p = heartRaw(i, N);
      heartPts.push({
        rx: p.x, ry: p.y,
        size: 6 + Math.random() * 5,
        color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
    stars = [];
    // 远星：多、小、暗、慢；近星：少、大、亮、偶发十字闪光
    for (i = 0; i < 80; i++){
      stars.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0005,
        vy: (Math.random() - 0.5) * 0.0005,
        r: 0.6 + Math.random() * 0.9,
        near: false,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1.0
      });
    }
    for (i = 0; i < 40; i++){
      stars.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0007,
        vy: (Math.random() - 0.5) * 0.0007,
        r: 1.6 + Math.random() * 1.0,
        near: true,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.4
      });
    }
    floaters = [];
    for (i = 0; i < 22; i++){
      floaters.push({
        x: Math.random(), y: Math.random(),
        vy: 0.25 + Math.random() * 0.55,
        size: 6 + Math.random() * 9,
        phase: Math.random() * Math.PI * 2,
        kind: Math.random() < 0.55 ? "heart" : "spark",
        color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0]
      });
    }
    balloons = [];
    for (i = 0; i < 9; i++){
      balloons.push({
        x: balloonX(), y: Math.random() * 1.2 - 0.2,
        vy: 0.10 + Math.random() * 0.14,
        size: 18 + Math.random() * 16,
        phase: Math.random() * Math.PI * 2,
        color: BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0]
      });
    }
    // 星空蛋糕糖珠：0=柱身彩珠，1=顶面缤纷糖珠
    cakePts = [];
    for (i = 0; i < 32; i++){
      cakePts.push({
        layer: 0,
        bx: 0.06 + Math.random() * 0.88, by: 0.15 + Math.random() * 0.7,
        r: 1 + Math.random() * 1.8,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
    for (i = 0; i < 18; i++){
      cakePts.push({
        layer: 1,
        bx: 0.2 + Math.random() * 0.6, by: 0.3 + Math.random() * 0.4,
        r: 0.9 + Math.random() * 1.5,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
    // 火焰上方金色火花
    sparks = [];
    for (i = 0; i < 16; i++){
      sparks.push({
        x: 0.5 + (Math.random() - 0.5) * 0.16,
        y: Math.random(),
        vy: 0.35 + Math.random() * 0.4,
        size: 1.5 + Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2
      });
    }
    tags = [];
    for (i = 0; i < BLESSINGS.length; i++){
      tags.push({
        text: BLESSINGS[i],
        ang: (i / BLESSINGS.length) * Math.PI * 2,
        rad: 1.08 + Math.random() * 0.12,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
    if (isNarrow){
      if (balloons.length > 5) balloons.length = 5;
      balloons.forEach(function(b){ b.x = balloonX(); });
    }
  }

  function computeLayout(){
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    heartPts.forEach(function(p){
      if (p.rx < minX) minX = p.rx;
      if (p.rx > maxX) maxX = p.rx;
      if (p.ry < minY) minY = p.ry;
      if (p.ry > maxY) maxY = p.ry;
    });
    var rangeX = maxX - minX, rangeY = maxY - minY;
    var narrow = W < 560;
    isNarrow = narrow;
    var scale = Math.min((W * (narrow ? 0.74 : 0.88)) / rangeX, (H * (narrow ? 0.46 : 0.54)) / rangeY);
    if (narrow) scale *= 0.9;
    layout = {
      ccx: W / 2, ccy: narrow ? H * 0.42 : H * 0.46, scale: scale,
      cakeW: Math.min(W * (narrow ? 0.56 : 0.60), narrow ? 300 : 420),
      cakeBaseY: H * 0.88
    };
  }

  /* ================= 缓动 ================= */
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  // 窄屏把气球挤到两侧边条，避开中间两列祝福标签；宽屏铺满
  function balloonX(){
    if (isNarrow){
      return Math.random() < 0.5 ? 0.03 + Math.random() * 0.13 : 0.84 + Math.random() * 0.13;
    }
    return Math.random();
  }
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function easeOutBack(x){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  /* ================= 绘制：小爱心 ================= */
  function drawHeart(x, y, s, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x - s, y - s * 0.45, x - s * 0.5, y - s * 1.05, x, y - s * 0.38);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 1.05, x + s, y - s * 0.45, x, y + s * 0.32);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ================= 绘制：气球 ================= */
  function drawBalloon(b, t){
    var sway = 18 * (b.size / 26);
    var bx = b.x * W + Math.sin(b.phase + t * (0.7 + b.size / 60)) * sway;
    var by = b.y * H;
    var s = isNarrow ? b.size * 0.72 : b.size;
    var breathe = 1 + 0.03 * Math.sin(t * 2 + b.phase);
    ctx.save();
    ctx.globalAlpha = isNarrow ? 0.55 : 0.82;
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by + s * 1.15);
    ctx.quadraticCurveTo(bx + Math.sin(t + b.phase) * 6, by + s * 1.6, bx, by + s * 2.05);
    ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.ellipse(bx, by, s * 0.8 * breathe, s * breathe, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath();
    ctx.ellipse(bx - s * 0.28, by - s * 0.35, s * 0.18 * breathe, s * 0.28 * breathe, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.moveTo(bx - s * 0.12, by + s * 0.95);
    ctx.lineTo(bx + s * 0.12, by + s * 0.95);
    ctx.lineTo(bx, by + s * 1.15);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ================= 绘制：单层圆柱星空蛋糕 ================= */

  function roundRect2(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStar(x, y, r, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 10; i++){
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rr = i % 2 === 0 ? r : r * 0.45;
      var px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 玻璃质感糖珠：彩色圆 + 左上高光点
  function drawPearl(x, y, r, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, Math.max(r * 0.28, 0.6), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 蛋糕周围环绕的彩色星星（一次性生成）
  var cakeStars = [];
  (function(){
    var cols = ["#FFD166", "#FFFFFF", "#7CC4FF", "#FF6B6B", "#FF8FB1", "#FFA94D", "#7CE8C6", "#B98CFF"];
    for (var i = 0; i < 40; i++){
      cakeStars.push({
        ang: Math.random() * Math.PI * 2,
        rad: 0.52 + Math.random() * 0.30,
        size: 3 + Math.random() * 6,
        big: Math.random() < 0.25,
        color: cols[(Math.random() * cols.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
  })();

  function drawCake(t, alpha, lift){
    var L = layout;
    var w = L.cakeW, cx = L.ccx;
    var hover = reduced ? 0 : Math.sin(t * 1.4) * w * 0.008;
    var baseY = L.cakeBaseY - lift - hover;
    var bodyW = w * 0.78, bodyH = w * 0.42;
    var topY = baseY - bodyH;
    var topRx = bodyW / 2, topRy = w * 0.09;
    var midY = topY + bodyH * 0.5;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 后方聚光：让蛋糕从暗背景中浮起，随呼吸轻微脉动
    var glowPulse = reduced ? 1 : 1 + 0.04 * Math.sin(t * 1.4);
    var glow = ctx.createRadialGradient(cx, midY, 1, cx, midY, w * 0.95 * glowPulse);
    glow.addColorStop(0, "rgba(150,120,220,.20)");
    glow.addColorStop(1, "rgba(150,120,220,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(cx, midY, w * 0.95 * glowPulse, w * 0.7 * glowPulse, 0, 0, Math.PI * 2);
    ctx.fill();

    // 落地投影
    var shadow = ctx.createRadialGradient(cx, baseY + w * 0.04, 1, cx, baseY + w * 0.04, w * 0.6);
    shadow.addColorStop(0, "rgba(0,0,0,.35)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.04, w * 0.6, w * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // 白色圆盘托盘 + 蓝色光环边
    ctx.fillStyle = "#F2F4FA";
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.56, w * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(120,170,255,.8)";
    ctx.lineWidth = w * 0.012;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.56, w * 0.09, 0, 0, Math.PI * 2);
    ctx.stroke();
    // 托盘内圈高光弧
    ctx.save();
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = w * 0.008;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.46, w * 0.07, 0, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.restore();
    // 盘面彩点
    var plateDots = [[0.30, 0.40, "#FFD166"], [0.50, 0.60, "#7CC4FF"], [0.70, 0.45, "#FF6B6B"], [0.60, 0.55, "#7CE8C6"]];
    plateDots.forEach(function(d){
      ctx.globalAlpha = alpha * 0.8;
      ctx.fillStyle = d[2];
      ctx.beginPath();
      ctx.arc(cx - w * 0.56 + d[0] * w * 1.12, baseY + w * 0.02 - w * 0.09 + d[1] * w * 0.18, w * 0.012, 0, Math.PI * 2);
      ctx.fill();
    });

    // 柱身（深蓝星空，左右明暗渐变）
    var bodyGrad = ctx.createLinearGradient(cx - bodyW / 2, 0, cx + bodyW / 2, 0);
    bodyGrad.addColorStop(0, "#0D1330");
    bodyGrad.addColorStop(0.5, "#1C2654");
    bodyGrad.addColorStop(1, "#0D1330");
    ctx.fillStyle = bodyGrad;
    roundRect2(cx - bodyW / 2, topY, bodyW, bodyH, w * 0.03);
    ctx.fill();

    // 柱身内嵌小星
    var bodyStars = [
      [0.18, 0.30, "#FFD166"], [0.30, 0.62, "#FFFFFF"], [0.72, 0.28, "#7CC4FF"],
      [0.82, 0.58, "#FF6B6B"], [0.55, 0.74, "#FF8FB1"], [0.42, 0.45, "#FFA94D"]
    ];
    bodyStars.forEach(function(s){
      drawStar(cx - bodyW / 2 + s[0] * bodyW, topY + s[1] * bodyH, w * 0.018, s[2], alpha * 0.7);
    });

    // 柱身彩色糖珠
    cakePts.forEach(function(p){
      if (p.layer !== 0) return;
      var bx = cx - bodyW / 2 + p.bx * bodyW;
      var by = topY + p.by * bodyH;
      drawPearl(bx, by, p.r, p.color, alpha * 0.6);
    });

    // 柱身底部蓝色光带 + 光晕
    ctx.fillStyle = "rgba(80,170,255,.35)";
    ctx.fillRect(cx - bodyW / 2, baseY - w * 0.05, bodyW, w * 0.05);
    var blueGlow = ctx.createRadialGradient(cx, baseY, 1, cx, baseY, bodyW * 0.55);
    blueGlow.addColorStop(0, "rgba(90,180,255,.30)");
    blueGlow.addColorStop(1, "rgba(90,180,255,0)");
    ctx.fillStyle = blueGlow;
    ctx.beginPath();
    ctx.ellipse(cx, baseY, bodyW * 0.55, w * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // 顶面金色碎屑糖霜
    ctx.fillStyle = "#F2C14E";
    ctx.beginPath();
    ctx.ellipse(cx, topY, topRx, topRy, 0, 0, Math.PI * 2);
    ctx.fill();
    // 糖霜厚度：上沿亮边、下沿暗边
    ctx.save();
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = "rgba(255,240,200,.8)";
    ctx.lineWidth = w * 0.008;
    ctx.beginPath();
    ctx.ellipse(cx, topY, topRx, topRy, 0, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.strokeStyle = "rgba(150,100,30,.45)";
    ctx.beginPath();
    ctx.ellipse(cx, topY, topRx, topRy, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.restore();
    var topDots = [
      [0.22, 0.42, "#FFE9B0"], [0.40, 0.60, "#7CC4FF"], [0.58, 0.34, "#FFA94D"],
      [0.74, 0.58, "#B98CFF"], [0.33, 0.56, "#7CE8C6"], [0.52, 0.50, "#FFFFFF"],
      [0.30, 0.30, "#FFD166"], [0.66, 0.44, "#FF6B6B"], [0.45, 0.38, "#FFC2D4"],
      [0.60, 0.62, "#9BE3D0"]
    ];
    topDots.forEach(function(d){
      ctx.globalAlpha = alpha * 0.85;
      ctx.fillStyle = d[2];
      ctx.beginPath();
      ctx.ellipse(cx - topRx + d[0] * topRx * 2, topY - topRy + d[1] * topRy * 2, w * 0.045, w * 0.026, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // 顶面糖珠
    cakePts.forEach(function(p){
      if (p.layer !== 1) return;
      var bx = cx - topRx + p.bx * topRx * 2;
      var by = topY - topRy + p.by * topRy * 2;
      drawPearl(bx, by, p.r, p.color, alpha * 0.65);
    });

    // 蜡烛
    var candleX = cx;
    var candleTop = topY - w * 0.15;
    var candleH = w * 0.15;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#F2C14E";
    ctx.fillRect(candleX - w * 0.016, candleTop, w * 0.032, candleH);
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(candleX - w * 0.016, candleTop, w * 0.010, candleH);
    // 蜡烛顶部融化蜡滴
    ctx.fillStyle = "#F2C14E";
    ctx.beginPath();
    ctx.arc(candleX - w * 0.016, candleTop + w * 0.006, w * 0.006, 0, Math.PI * 2);
    ctx.arc(candleX + w * 0.016, candleTop + w * 0.006, w * 0.006, 0, Math.PI * 2);
    ctx.fill();

    // 晃动火焰（白核心 + 金黄中层 + 橙色光晕，带摇曳与脉动）
    var fx = candleX + Math.sin(t * 3) * w * 0.008;
    var fy = candleTop - w * 0.035 + Math.sin(t * 5) * w * 0.004;
    var fr = w * 0.045;
    var flick = 1 + 0.08 * Math.sin(t * 7);
    var glowPulse = 1 + 0.1 * Math.sin(t * 6);
    var grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, fr * 2.2 * glowPulse);
    grad.addColorStop(0, "#FFF6D8");
    grad.addColorStop(0.45, "#FFD166");
    grad.addColorStop(1, "rgba(255,120,60,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(fx, fy, fr * 0.72 * flick, fr * 1.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FFE9A8";
    ctx.beginPath();
    ctx.arc(fx, fy, fr * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FFFBEF";
    ctx.beginPath();
    ctx.arc(fx, fy, fr * 0.2, 0, Math.PI * 2);
    ctx.fill();

    // 柱身英文小字
    ctx.save();
    ctx.globalAlpha = alpha * 0.95;
    var txtY = topY + bodyH * 0.62;
    ctx.fillStyle = "#FFFFFF";
    ctx.font = (w * 0.05) + "px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.strokeStyle = "rgba(10,16,38,.55)";
    ctx.lineWidth = 1.2;
    ctx.strokeText("happy birthday", cx, txtY);
    ctx.fillText("happy birthday", cx, txtY);
    ctx.restore();

    ctx.restore();

    // 外围主圆环 + 左侧平行弧线笔触
    ctx.save();
    ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = "rgba(245,200,110,.65)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, midY, w * 0.70, w * 0.34, 0, 0, Math.PI * 2);
    ctx.stroke();
    for (var a = 0; a < 3; a++){
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.06, midY, w * (0.62 - 0.05 * a), w * (0.30 - 0.03 * a), -0.12, Math.PI * 0.55, Math.PI * 1.05);
      ctx.stroke();
    }
    ctx.restore();

    // 周围环绕的彩色五角星（带柔光光晕）
    cakeStars.forEach(function(s){
      var sang = s.ang + (reduced ? 0 : t * 0.05);
      var sx = cx + Math.cos(sang) * w * s.rad;
      var sy = midY + Math.sin(sang) * w * s.rad * 0.7;
      var tw = 0.6 + 0.4 * Math.sin(s.phase + t * 2);
      var depth = 1 - (s.rad - 0.52) / 0.30 * 0.25;
      var sz = s.big ? s.size * 1.35 : s.size;
      ctx.save();
      ctx.globalAlpha = alpha * tw * depth * 0.22;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(sx, sy, sz * 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      drawStar(sx, sy, sz, s.color, alpha * tw * depth);
    });

    // 火焰上方金色火花
    sparks.forEach(function(sp){
      var sx = cx + (sp.x - 0.5) * w * 0.5 + Math.sin(sp.phase + t * 2) * w * 0.012;
      var sy = candleTop - sp.y * w * 0.55;
      var tw = 0.4 + 0.6 * Math.abs(Math.sin(sp.phase + t * 3));
      ctx.save();
      ctx.globalAlpha = alpha * tw;
      ctx.fillStyle = "#FFE9A8";
      ctx.beginPath();
      ctx.arc(sx, sy, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  /* ================= 满屏祝福弹窗 ================= */
  var popLayer = document.getElementById("popups");
  var popTimer = 0;

  function spawnPopup(){
    var el = document.createElement("div");
    el.className = "pop";
    el.textContent = BLESSINGS[(Math.random() * BLESSINGS.length) | 0];
    el.style.background = POP_COLORS[(Math.random() * POP_COLORS.length) | 0];
    if (isNarrow){
      el.style.top = (34 + Math.random() * 38) + "%";
      var ls = Math.random() < 0.5;
      el.style.left = (ls ? 2 : 83) + Math.random() * 14 + "%";
    } else {
      el.style.top = (38 + Math.random() * 44) + "%";
      var leftSide = Math.random() < 0.5;
      el.style.left = (leftSide ? 6 : 70) + Math.random() * 24 + "%";
    }
    popLayer.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("in", "float"); });
    popCards.push({ el: el, born: performance.now(), life: 11000 + Math.random() * 4000 });
  }

  function clearPopups(){
    popCards.forEach(function(c){ c.el.remove(); });
    popCards = [];
    popTimer = 0;
  }

  function updatePopups(now, heartP){
    if (!reduced && !isNarrow && heartP > 0.85 && popCards.length < 22){
      popTimer += 1 / 60;
      if (popTimer > 0.35){ popTimer = 0; spawnPopup(); }
    }
    for (var i = popCards.length - 1; i >= 0; i--){
      var c = popCards[i];
      if (now - c.born > c.life){
        c.el.classList.remove("in");
        var el = c.el;
        setTimeout(function(){ el.remove(); }, 400);
        popCards.splice(i, 1);
      }
    }
  }

  /* ================= 背景音乐：Web Audio 合成生日歌 =================
     只保留一个循环定时器；每遍排程结束后记录 nextAt，到点才排下一遍，
     避免多个定时器叠加导致的重音/叠音。 */
  var Music = {
    ctx: null, master: null, playing: false, loopTimer: null, nextAt: 0,
    beat: 0.46,
    notes: [
      [392.00, .75], [392.00, .25], [440.00, 1], [392.00, 1], [523.25, 1], [493.88, 2],
      [392.00, .75], [392.00, .25], [440.00, 1], [392.00, 1], [587.33, 1], [523.25, 2],
      [392.00, .75], [392.00, .25], [783.99, 1], [659.25, 1], [523.25, 1], [493.88, 1], [440.00, 2],
      [698.46, .75], [698.46, .25], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2]
    ],
    playNote: function(freq, start, dur){
      var osc = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.linearRampToValueAtTime(0.85, start + 0.03);
      g.gain.setValueAtTime(0.85, start + dur * 0.6);
      g.gain.linearRampToValueAtTime(0.001, start + dur * 0.95);
      osc.connect(g); g.connect(this.master);
      osc.start(start); osc.stop(start + dur);
    },
    scheduleOnce: function(){
      var self = this;
      var t0 = this.ctx.currentTime + 0.08;
      var cursor = t0;
      this.notes.forEach(function(n){
        var dur = n[1] * self.beat;
        self.playNote(n[0], cursor, dur);
        cursor += dur;
      });
      this.nextAt = cursor + 0.15;
    },
    start: function(){
      if (this.playing){ if (this.ctx){ this.ctx.resume(); } return; }
      if (!this.ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.32;
        this.master.connect(this.ctx.destination);
      }
      this.ctx.resume();
      this.playing = true;
      this.scheduleOnce();
      if (!this.loopTimer){
        var self = this;
        this.loopTimer = setInterval(function(){
          if (!self.playing) return;
          if (self.ctx.currentTime >= self.nextAt - 0.05){ self.scheduleOnce(); }
        }, 300);
      }
    },
    stop: function(){
      this.playing = false;
      if (this.loopTimer){ clearInterval(this.loopTimer); this.loopTimer = null; }
      if (this.ctx){ this.ctx.suspend(); }
    }
  };

  /* ================= 主循环 ================= */
  var start = performance.now();
  var greetingEl = document.getElementById("greeting");
  var nameEl = document.getElementById("nameLine");
  var subEl = document.getElementById("subtitle");

  nameEl.textContent = NAME;
  subEl.textContent = SUBTITLE;

  function frame(now){
    var t = reduced ? 99 : (now - start) / 1000;
    ctx.clearRect(0, 0, W, H);

    stars.forEach(function(s){
      if (!reduced){
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0) s.x += 1; if (s.x > 1) s.x -= 1;
        if (s.y < 0) s.y += 1; if (s.y > 1) s.y -= 1;
      }
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(s.phase + t * s.speed));
      var sx = s.x * W, sy = s.y * H;
      ctx.globalAlpha = tw * (s.near ? 0.9 : 0.55);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.near){
        ctx.globalAlpha = tw * 0.45;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 1;
        var L = s.r * 2.4;
        ctx.beginPath();
        ctx.moveTo(sx - L, sy); ctx.lineTo(sx + L, sy);
        ctx.moveTo(sx, sy - L); ctx.lineTo(sx, sy + L);
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    balloons.forEach(function(b){
      if (!reduced){
        b.y -= b.vy / 100;
        if (b.y < -0.15){ b.y = 1.1; b.x = balloonX(); }
      }
      drawBalloon(b, t);
    });

    var heartP = reduced ? 1 : clamp((t - 1.2) / 2.4, 0, 1);
    var cakeA  = reduced ? 1 : clamp((t - 3.2) / 1.0, 0, 1);
    var cakeLift = reduced ? 0 : (1 - easeOutCubic(cakeA)) * 40;
    var breath = reduced ? 1 : 1 + 0.02 * Math.sin(t * (Math.PI * 2 / 2.4));

    var grown = Math.floor(heartP * heartPts.length);
    heartPts.forEach(function(p, i){
      if (i >= grown) return;
      var born = i / heartPts.length;
      var local = clamp((heartP - born) / (1 / heartPts.length + 0.001), 0, 1);
      var pop = clamp(reduced ? 1 : easeOutBack(local), 0, 1);
      var px = layout.ccx + (p.rx * layout.scale) * breath;
      var py = layout.ccy - (p.ry * layout.scale) * breath;
      var sway = reduced ? 0 : Math.sin(p.phase + t * 2.2) * p.size * 0.06;
      px += sway;
      var pulse = reduced ? 1 : 1 + 0.07 * Math.sin(p.phase + t * 3.2) + 0.04 * Math.sin(p.phase + t * 6.4 + 1.2);
      drawHeart(px, py, p.size * pop * pulse, p.color, 0.92 * pop);
    });

    tags.forEach(function(g, idx){
      if (heartP < 0.6) return;
      var gang = g.ang + (reduced ? 0 : t * 0.02);
      var radMul = isNarrow ? 0.92 : 1.0;
      var rx = layout.scale * 16 * g.rad * radMul * breath;
      var ry = layout.scale * 12 * g.rad * radMul * breath;
      var gx = layout.ccx + Math.cos(gang) * rx;
      var gy = layout.ccy - Math.sin(gang) * ry;
      // 窄屏限制左右边距，避免文字被屏幕边缘裁切
      if (isNarrow){ gx = clamp(gx, 30, W - 30); }
      var align = "center";
      var floatY = reduced ? 0 : Math.sin(g.phase + t * 1.2) * 6;
      ctx.save();
      ctx.globalAlpha = 0.75 * easeOutCubic(heartP);
      ctx.font = (isNarrow ? 11 : 13) + "px 'Microsoft YaHei', sans-serif";
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(20,10,30,.65)";
      ctx.strokeText(g.text, gx, gy + floatY);
      ctx.fillStyle = "#FFD9E6";
      ctx.fillText(g.text, gx, gy + floatY);
      ctx.restore();
    });

    // 火花上升回收
    if (!reduced){
      sparks.forEach(function(sp){
        sp.y -= sp.vy / 100;
        if (sp.y < 0){ sp.y = 1; sp.x = 0.5 + (Math.random() - 0.5) * 0.16; }
      });
    }

    if (cakeA > 0){
      drawCake(t, easeOutCubic(cakeA), cakeLift);
    }

    floaters.forEach(function(f){
      if (!reduced){
        f.y -= f.vy / 100;
        if (f.y < -0.05){ f.y = 1.05; f.x = Math.random(); }
      }
      var fx = f.x * W + Math.sin(f.phase + t) * 14;
      var fy = f.y * H;
      if (f.kind === "heart"){
        drawHeart(fx, fy, f.size, f.color, 0.6);
      } else {
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(fx, fy, f.size * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    });

    updatePopups(now, heartP);

    if (t > 4.2 && !greetingEl.classList.contains("show")){
      greetingEl.classList.add("show");
    }

    requestAnimationFrame(frame);
  }

  /* ================= 交互 ================= */
  document.getElementById("btnReplay").addEventListener("click", function(){
    start = performance.now();
    greetingEl.classList.remove("show");
    clearPopups();
  });

  var musicOn = true;
  var btnMusic = document.getElementById("btnMusic");
  btnMusic.addEventListener("click", function(){
    musicOn = !musicOn;
    if (musicOn){
      Music.start();
      btnMusic.textContent = "音乐 开";
    } else {
      Music.stop();
      btnMusic.textContent = "音乐 关";
    }
  });

  // 默认开启：受浏览器自动播放限制，首次点击 / 触摸 / 按键时解锁发声
  function unlockMusic(){
    if (musicOn){ Music.start(); }
  }
  ["pointerdown", "touchstart", "keydown"].forEach(function(ev){
    document.addEventListener(ev, unlockMusic);
  });

  var btnFull = document.getElementById("btnFull");
  btnFull.addEventListener("click", function(){
    if (document.fullscreenElement){
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
  });

  window.addEventListener("resize", resize);

  buildStatic();
  resize();
  try { Music.start(); } catch (e) {}
  requestAnimationFrame(frame);
})();
</script>
</body>
