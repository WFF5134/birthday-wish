<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171024">
<meta name="description" content="生日快乐祝福页：爱心粒子、蛋糕蜡烛、环绕祝福与生日歌。">
<title>♡生日快乐♡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23FF6B9D' d='M12 21s-7.5-4.9-10-9.2C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z'/></svg>">
<style>
  :root{
    --bg-1:#2A1836; --bg-2:#171024; --bg-3:#0E0A18;
    --pink:#FF6B9D; --pink-soft:#FF8FB1; --cream:#FFF5F7; --sub:#E8B9C9;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(ellipse 70% 45% at 50% 18%, rgba(120,70,140,.35) 0%, rgba(120,70,140,0) 70%),
      radial-gradient(ellipse 80% 50% at 50% 92%, rgba(50,70,140,.30) 0%, rgba(50,70,140,0) 70%),
      radial-gradient(ellipse at 50% 32%, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    color:var(--cream);
  }
  #scene{ position:fixed; inset:0; display:block; }

  /* ===== 满屏祝福弹窗层 ===== */
  #popups{ position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
  @media (max-width:560px){ #popups{ display:none; } }
  .pop{
    position:absolute; padding:8px 14px; border-radius:14px;
    font-size:14px; color:#4A3644; white-space:nowrap;
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 6px 18px rgba(15,8,28,.38), 0 2px 6px rgba(15,8,28,.22);
    opacity:0; transform:scale(.6);
    transition:opacity .4s ease, transform .4s cubic-bezier(.22,1,.36,1);
  }
  .pop.in{ opacity:.95; transform:scale(1); }
  .pop.float{ animation:popFloat 3.2s ease-in-out infinite; }
  @keyframes popFloat{ 0%,100%{ margin-top:0; } 50%{ margin-top:-8px; } }

  /* ===== 祝福文案层 ===== */
  .greeting{
    position:fixed; top:4%; left:0; right:0;
    text-align:center; pointer-events:none; z-index:7;
    opacity:0; transform:translateY(18px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(0.22,1,0.36,1);
    padding:0 20px;
  }
  .greeting.show{ opacity:1; transform:translateY(0); }
  .greeting .name{
    font-size:clamp(18px, 3.2vw, 26px);
    font-weight:700; letter-spacing:0.18em;
    color:var(--pink-soft);
    text-shadow:0 0 18px rgba(255,143,177,.5), 0 2px 8px rgba(0,0,0,.35);
    margin-bottom:6px;
  }
  .greeting h1{
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-size:clamp(28px, 5.4vw, 46px);
    font-weight:800; letter-spacing:0.06em;
    color:var(--cream);
    text-shadow:0 0 24px rgba(255,107,157,.55), 0 2px 10px rgba(0,0,0,.4);
  }
  .heart-ico{ width:0.9em; height:0.9em; flex:none; color:var(--cream); }
  .greeting p{
    margin-top:8px;
    font-size:clamp(13px, 2.2vw, 16px);
    letter-spacing:0.12em; color:var(--sub);
    text-shadow:0 0 14px rgba(255,143,177,.32), 0 1px 6px rgba(0,0,0,.45);
  }
  .music-hint{
    margin-top:6px; font-size:clamp(11px, 1.8vw, 13px); letter-spacing:0.1em;
    color:var(--pink-soft); opacity:0; transition:opacity .5s ease;
  }
  .music-hint.show{ opacity:.8; animation:hintPulse 2.4s ease-in-out infinite; }
  @keyframes hintPulse{ 0%,100%{opacity:.45;} 50%{opacity:.85;} }
  @keyframes nameGlow{
    0%,100%{ text-shadow:0 0 18px rgba(255,143,177,.5), 0 2px 8px rgba(0,0,0,.35); transform:translateY(0); }
    50%{ text-shadow:0 0 32px rgba(255,143,177,.85), 0 2px 8px rgba(0,0,0,.35); transform:translateY(-3px); }
  }
  @keyframes titleGlow{
    0%,100%{ text-shadow:0 0 24px rgba(255,107,157,.55), 0 2px 10px rgba(0,0,0,.4); transform:translateY(0); }
    50%{ text-shadow:0 0 40px rgba(255,107,157,.9), 0 2px 10px rgba(0,0,0,.4); transform:translateY(-4px); }
  }
  .greeting .name{ animation:nameGlow 3s ease-in-out infinite; }
  .greeting h1{ animation:titleGlow 3.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .greeting .name, .greeting h1{ animation:none; }
  }

  /* ===== 右下角控制按钮 ===== */
  .controls{
    position:fixed; right:16px; bottom:16px; display:flex; gap:10px; z-index:10;
  }
  .controls button{
    appearance:none; border:1px solid rgba(255,143,177,.45);
    background:linear-gradient(160deg, rgba(64,36,78,.72), rgba(30,18,40,.6));
    color:var(--pink-soft);
    font-family:inherit; font-size:14px; letter-spacing:0.05em;
    padding:9px 16px; border-radius:999px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .controls button:hover{
    background:linear-gradient(160deg, rgba(96,48,96,.72), rgba(40,22,52,.6));
    box-shadow:0 6px 18px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12);
    transform:translateY(-2px);
  }
  .controls button:active{
    transform:translateY(0);
    box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .controls button:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }

  @media (max-width:480px){
    .greeting{ top:5%; }
    .controls{ right:8px; bottom:8px; gap:5px; }
    .controls button{ padding:4px 8px; font-size:11px; letter-spacing:0.03em; }
    .pop{ font-size:12px; padding:6px 11px; border-radius:12px; white-space:normal; max-width:38%; line-height:1.35; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="popups"></div>

<div class="greeting" id="greeting">
  <div class="name" id="nameLine">张彬铃小朋友</div>
  <h1 id="title">
    <svg class="heart-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>生日快乐</span>
    <svg class="heart-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </h1>
  <p id="subtitle">愿你新的一岁 继续闪闪发光</p>
  <p id="musicHint" class="music-hint">轻点屏幕 开启音乐</p>
</div>

<audio id="bgm" src="birthday.m4a" loop preload="auto" autoplay></audio>
<div class="controls">
  <button id="btnReplay" type="button">重播</button>
  <button id="btnMusic" type="button">音乐 开</button>
  <button id="btnFull" type="button">全屏</button>
</div>

<script>
(function(){
  "use strict";

  /* ================= 可配置项 ================= */
  // 想写名字：页面地址后加 ?name=某某，例如 生日祝福爱心.html?name=小美
  var params = new URLSearchParams(location.search);
  var NAME = (params.get("name") || "张彬铃小朋友").trim();
  if (NAME.length > 12) NAME = NAME.slice(0, 12) + "…";
  var SUBTITLE = "愿你新的一岁 继续闪闪发光";

  var BLESSINGS = [
    "天天开心", "万事顺意", "平安喜乐", "心想事成",
    "所愿皆成真", "好运常伴", "未来越来越好", "被世界温柔以待",
    "好好吃饭", "保持好心情", "顺顺利利", "别熬夜",
    "天凉多穿衣", "今天你最大", "要继续闪闪发光", "我想你了"
  ];
  var POP_COLORS = ["#FFE3EE", "#E3F2FF", "#FFF6D6", "#DFF7EC", "#EFE3FF", "#FFE0F7"];

  var HEART_COLORS = ["#FF6B9D", "#FF8FB1", "#FFA6C1", "#F75C8A", "#FFC2D4"];
  var SPARK_COLORS = ["#FFD166", "#7CC4FF", "#B98CFF", "#7CE8C6", "#FF8A8A", "#FFF3B0"];
  var BALLOON_COLORS = ["#FF6B9D", "#FFD166", "#7CC4FF", "#B98CFF", "#7CE8C6", "#FF8A8A", "#FFA6C1"];

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= 画布与尺寸 ================= */
  var cvs = document.getElementById("scene");
  var ctx = cvs.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var isNarrow = false;

  /* ================= 场景对象 ================= */
  var stars = [];
  var floaters = [];
  var balloons = [];
  var heartPts = [];
  var cakePts = [];     // 粒子彩虹阶梯蛋糕散点
  var sparks = [];      // 火焰上方金色火花
  var tags = [];
  var popCards = [];
  var nebulae = [];    // 背景缓慢漂移的柔光斑
  var confetti = [];   // 飘落庆典彩屑
  var tapHearts = [];  // 点按迸发的小爱心
  var fireworks = []; // 开场/重播的庆祝烟花
  var fwFired = false; // 入场烟花是否已放
  var fwWave = 0;      // 已放烟花波次
  var lastAutoFw = 0;  // 最近一次自动烟花时间戳
  var nextAutoFw = 4200; // 距下次自动烟花的间隔(ms)
  var rockets = [];     // 升空后再炸开的烟花火箭
  var meteors = [];     // 偶发划过的流星
  var ripples = [];     // 点按扩散涟漪
  var lastMeteor = 0, nextMeteor = 5000;   // 流星触发计时

  var layout = {};

  function heartRaw(i, n){
    var t = 2 * Math.PI * i / n;
    var s = Math.sin(t);
    var x = 16 * s * s * s;
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: y };
  }

  function buildStatic(){
    var i, p;
    heartPts = [];
    var N = 90;
    for (i = 0; i < N; i++){
      p = heartRaw(i, N);
      heartPts.push({
        rx: p.x, ry: p.y,
        size: 6 + Math.random() * 5,
        color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
    stars = [];
    // 远星：多、小、暗、慢；近星：少、大、亮、偶发十字闪光
    for (i = 0; i < 80; i++){
      stars.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0005,
        vy: (Math.random() - 0.5) * 0.0005,
        r: 0.6 + Math.random() * 0.9,
        near: false,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1.0
      });
    }
    for (i = 0; i < 40; i++){
      stars.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0007,
        vy: (Math.random() - 0.5) * 0.0007,
        r: 1.6 + Math.random() * 1.0,
        near: true,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.4
      });
    }
    floaters = [];
    for (i = 0; i < 22; i++){
      floaters.push({
        x: Math.random(), y: Math.random(),
        vy: 0.25 + Math.random() * 0.55,
        size: 6 + Math.random() * 9,
        phase: Math.random() * Math.PI * 2,
        kind: Math.random() < 0.55 ? "heart" : "spark",
        color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0]
      });
    }
    balloons = [];
    for (i = 0; i < 9; i++){
      balloons.push({
        x: balloonX(), y: Math.random() * 1.2 - 0.2,
        vy: 0.10 + Math.random() * 0.14,
        size: 18 + Math.random() * 16,
        phase: Math.random() * Math.PI * 2,
        color: BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0]
      });
    }
    // 星空蛋糕糖珠：0=柱身彩珠，1=顶面缤纷糖珠
    cakePts = [];
    for (i = 0; i < 32; i++){
      cakePts.push({
        layer: 0,
        bx: 0.06 + Math.random() * 0.88, by: 0.15 + Math.random() * 0.7,
        r: 1 + Math.random() * 1.8,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
    for (i = 0; i < 18; i++){
      cakePts.push({
        layer: 1,
        bx: 0.2 + Math.random() * 0.6, by: 0.3 + Math.random() * 0.4,
        r: 0.9 + Math.random() * 1.5,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
    // 火焰上方金色火花
    sparks = [];
    for (i = 0; i < 16; i++){
      sparks.push({
        x: 0.5 + (Math.random() - 0.5) * 0.16,
        y: Math.random(),
        vy: 0.35 + Math.random() * 0.4,
        size: 1.5 + Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2
      });
    }
    tags = [];
    for (i = 0; i < BLESSINGS.length; i++){
      tags.push({
        text: BLESSINGS[i],
        ang: (i / BLESSINGS.length) * Math.PI * 2,
        rad: 1.08 + Math.random() * 0.12,
        phase: Math.random() * Math.PI * 2
      });
    }
    // 背景星云柔光斑
    nebulae = [
      { x: 0.22, y: 0.28, r: 0.42, color: "150,90,170", phase: 0.0, drift: 0.05 },
      { x: 0.80, y: 0.22, r: 0.38, color: "90,110,190",  phase: 2.1, drift: 0.04 },
      { x: 0.50, y: 0.80, r: 0.45, color: "190,80,130",  phase: 4.0, drift: 0.045 }
    ];
    // 飘落彩屑
    confetti = [];
    for (i = 0; i < 24; i++){
      confetti.push({
        x: Math.random(), y: Math.random(),
        vy: 0.12 + Math.random() * 0.22,
        sway: 10 + Math.random() * 16,
        size: 4 + Math.random() * 4,
        color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
        phase: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.06,
        shape: (Math.random() * 3) | 0
      });
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
    if (isNarrow){
      if (balloons.length > 5) balloons.length = 5;
      balloons.forEach(function(b){ b.x = balloonX(); });
      if (confetti.length > 12) confetti.length = 12;
      if (stars.length > 70) stars.length = 70;
      if (floaters.length > 12) floaters.length = 12;
    }
  }

  function computeLayout(){
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    heartPts.forEach(function(p){
      if (p.rx < minX) minX = p.rx;
      if (p.rx > maxX) maxX = p.rx;
      if (p.ry < minY) minY = p.ry;
      if (p.ry > maxY) maxY = p.ry;
    });
    var rangeX = maxX - minX, rangeY = maxY - minY;
    var narrow = W < 560;
    isNarrow = narrow;
    var scale = Math.min((W * (narrow ? 0.74 : 0.88)) / rangeX, (H * (narrow ? 0.46 : 0.54)) / rangeY);
    if (narrow) scale *= 0.9;
    layout = {
      ccx: W / 2, ccy: narrow ? H * 0.42 : H * 0.46, scale: scale,
      cakeW: Math.min(W * (narrow ? 0.56 : 0.60), narrow ? 300 : 420),
      cakeBaseY: H * 0.88
    };
  }

  /* ================= 缓动 ================= */
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  // 窄屏把气球挤到两侧边条，避开中间两列祝福标签；宽屏铺满
  function balloonX(){
    if (isNarrow){
      return Math.random() < 0.5 ? 0.03 + Math.random() * 0.13 : 0.84 + Math.random() * 0.13;
    }
    return Math.random();
  }
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function easeOutBack(x){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  /* ================= 绘制：小爱心 ================= */
  function drawHeart(x, y, s, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x - s, y - s * 0.45, x - s * 0.5, y - s * 1.05, x, y - s * 0.38);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 1.05, x + s, y - s * 0.45, x, y + s * 0.32);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ================= 绘制：气球 ================= */
  function drawBalloon(b, t){
    var sway = 18 * (b.size / 26);
    var bx = b.x * W + Math.sin(b.phase + t * (0.7 + b.size / 60)) * sway;
    var by = b.y * H;
    var s = isNarrow ? b.size * 0.72 : b.size;
    var breathe = 1 + 0.03 * Math.sin(t * 2 + b.phase);
    ctx.save();
    ctx.globalAlpha = isNarrow ? 0.55 : 0.82;
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by + s * 1.15);
    ctx.quadraticCurveTo(bx + Math.sin(t + b.phase) * 6, by + s * 1.6, bx, by + s * 2.05);
    ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.ellipse(bx, by, s * 0.8 * breathe, s * breathe, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath();
    ctx.ellipse(bx - s * 0.28, by - s * 0.35, s * 0.18 * breathe, s * 0.28 * breathe, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.moveTo(bx - s * 0.12, by + s * 0.95);
    ctx.lineTo(bx + s * 0.12, by + s * 0.95);
    ctx.lineTo(bx, by + s * 1.15);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ================= 绘制：单层圆柱星空蛋糕 ================= */

  function drawStar(x, y, r, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 10; i++){
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rr = i % 2 === 0 ? r : r * 0.45;
      var px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 玻璃质感糖珠：彩色圆 + 左上高光点
  function drawPearl(x, y, r, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, Math.max(r * 0.28, 0.6), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 草莓：红果身 + 籽点 + 绿叶蒂
  function drawStrawberry(x, y, s, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#E8445A";
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.55);
    ctx.bezierCurveTo(x - s, y + s * 0.1, x - s * 0.62, y - s * 0.5, x, y - s * 0.28);
    ctx.bezierCurveTo(x + s * 0.62, y - s * 0.5, x + s, y + s * 0.1, x, y + s * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,235,180,.9)";
    var seeds = [[-0.3, -0.05], [0.3, -0.05], [-0.15, 0.2], [0.15, 0.2], [0, 0.38]];
    seeds.forEach(function(q){
      ctx.beginPath();
      ctx.arc(x + q[0] * s, y + q[1] * s, Math.max(s * 0.08, 0.5), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = "#58B368";
    ctx.beginPath();
    ctx.moveTo(x - s * 0.42, y - s * 0.28);
    ctx.lineTo(x, y - s * 0.55);
    ctx.lineTo(x + s * 0.42, y - s * 0.28);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 樱桃：双红果 + 高光 + 弯梗
  function drawCherries(x, y, s, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#7A5230";
    ctx.lineWidth = Math.max(s * 0.12, 0.8);
    ctx.beginPath();
    ctx.moveTo(x - s * 0.25, y + s * 0.1);
    ctx.quadraticCurveTo(x, y - s * 0.7, x + s * 0.15, y - s * 0.2);
    ctx.stroke();
    [[-0.28, 0.12], [0.24, 0.2]].forEach(function(q){
      ctx.fillStyle = "#D62845";
      ctx.beginPath();
      ctx.arc(x + q[0] * s, y + q[1] * s, s * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath();
      ctx.arc(x + q[0] * s - s * 0.1, y + q[1] * s - s * 0.12, s * 0.09, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // 橙子片：橙皮 + 果肉分瓣
  function drawOrange(x, y, s, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#F59A23";
    ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFC45E";
    ctx.beginPath(); ctx.arc(x, y, s * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = Math.max(s * 0.05, 0.5);
    for (var a = 0; a < 6; a++){
      var ang = a * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(ang) * s * 0.4, y + Math.sin(ang) * s * 0.4);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 阳光玫瑰：单颗青提（一颗一颗独立摆放）
  function drawGrape(x, y, s, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#CDE87A";
    ctx.beginPath();
    ctx.arc(x, y, s * 0.34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#B9E06A";
    ctx.beginPath();
    ctx.arc(x, y + s * 0.05, s * 0.34, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.arc(x - s * 0.11, y - s * 0.12, s * 0.09, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7A5230";
    ctx.beginPath();
    ctx.arc(x, y - s * 0.34, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 柱身水平渐变缓存：颜色与左右边界只随蛋糕宽度变化，尺寸不变时复用
  var bodyGradCache = { key: 0, grad: null };

  // 蛋糕周围环绕的彩色星星（一次性生成）
  var cakeStars = [];
  (function(){
    var cols = ["#FFD166", "#FFFFFF", "#7CC4FF", "#FF6B6B", "#FF8FB1", "#FFA94D", "#7CE8C6", "#B98CFF"];
    for (var i = 0; i < 40; i++){
      cakeStars.push({
        ang: Math.random() * Math.PI * 2,
        rad: 0.52 + Math.random() * 0.30,
        size: 3 + Math.random() * 6,
        big: Math.random() < 0.25,
        color: cols[(Math.random() * cols.length) | 0],
        phase: Math.random() * Math.PI * 2
      });
    }
  })();

  function drawCake(t, alpha, lift){
    var L = layout;
    var w = L.cakeW, cx = L.ccx;
    var hover = reduced ? 0 : Math.sin(t * 1.4) * w * 0.008;
    var baseY = L.cakeBaseY - lift - hover;
    var bodyW = w * 0.78, bodyH = w * 0.42;
    var topY = baseY - bodyH;
    var topRx = bodyW / 2, topRy = w * 0.09, bottomRy = w * 0.13;
    var midY = topY + bodyH * 0.5;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 后方聚光：让蛋糕从暗背景中浮起，随呼吸轻微脉动
    var glowPulse = reduced ? 1 : 1 + 0.04 * Math.sin(t * 1.4);
    var glow = ctx.createRadialGradient(cx, midY, 1, cx, midY, w * 0.95 * glowPulse);
    glow.addColorStop(0, "rgba(150,120,220,.20)");
    glow.addColorStop(1, "rgba(150,120,220,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(cx, midY, w * 0.95 * glowPulse, w * 0.7 * glowPulse, 0, 0, Math.PI * 2);
    ctx.fill();

    // 落地投影
    var shadow = ctx.createRadialGradient(cx, baseY + w * 0.04, 1, cx, baseY + w * 0.04, w * 0.6);
    shadow.addColorStop(0, "rgba(0,0,0,.35)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.04, w * 0.6, w * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // 白色圆盘托盘 + 蓝色光环边
    ctx.fillStyle = "#F2F4FA";
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.56, w * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    // 托盘内阴影：盘沿一圈柔和暗边，增加托盘厚度感
    var trayShade = ctx.createRadialGradient(cx, baseY + w * 0.02, w * 0.28, cx, baseY + w * 0.02, w * 0.56);
    trayShade.addColorStop(0, "rgba(0,0,0,0)");
    trayShade.addColorStop(1, "rgba(60,80,120,.18)");
    ctx.fillStyle = trayShade;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.56, w * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(120,170,255,.8)";
    ctx.lineWidth = w * 0.012;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.56, w * 0.09, 0, 0, Math.PI * 2);
    ctx.stroke();
    // 托盘内圈高光弧
    ctx.save();
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = w * 0.008;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + w * 0.02, w * 0.46, w * 0.07, 0, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.restore();
    // 盘面彩点
    var plateDots = [[0.30, 0.40, "#FFD166"], [0.50, 0.60, "#7CC4FF"], [0.70, 0.45, "#FF6B6B"], [0.60, 0.55, "#7CE8C6"]];
    plateDots.forEach(function(d){
      ctx.globalAlpha = alpha * 0.8;
      ctx.fillStyle = d[2];
      ctx.beginPath();
      ctx.arc(cx - w * 0.56 + d[0] * w * 1.12, baseY + w * 0.02 - w * 0.09 + d[1] * w * 0.18, w * 0.012, 0, Math.PI * 2);
      ctx.fill();
    });

    // 柱身（深蓝星空，左右明暗渐变）——圆柱侧面：左右竖边 + 底部椭圆弧收口
    var bgKey = Math.round(bodyW);
    if (bodyGradCache.key !== bgKey || !bodyGradCache.grad){
      bodyGradCache.key = bgKey;
      bodyGradCache.grad = ctx.createLinearGradient(cx - bodyW / 2, 0, cx + bodyW / 2, 0);
      bodyGradCache.grad.addColorStop(0, "#0D1330");
      bodyGradCache.grad.addColorStop(0.5, "#1C2654");
      bodyGradCache.grad.addColorStop(1, "#0D1330");
    }
    ctx.fillStyle = bodyGradCache.grad;
    var bodyRx = bodyW / 2;
    var bottomRx = bodyRx * 0.92;
    var cornerR = w * 0.07;
    ctx.beginPath();
    ctx.moveTo(cx - bodyRx, topY);
    ctx.lineTo(cx - bodyRx, baseY - cornerR);
    ctx.quadraticCurveTo(cx - bodyRx, baseY, cx - bottomRx, baseY);
    ctx.lineTo(cx + bottomRx, baseY);
    ctx.quadraticCurveTo(cx + bodyRx, baseY, cx + bodyRx, baseY - cornerR);
    ctx.lineTo(cx + bodyRx, topY);
    ctx.closePath();
    ctx.fill();

    // 柱身正面柔高光：裁在柱身内，模拟光源、增强圆柱立体感
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - bodyRx, topY);
    ctx.lineTo(cx - bodyRx, baseY - cornerR);
    ctx.quadraticCurveTo(cx - bodyRx, baseY, cx - bottomRx, baseY);
    ctx.lineTo(cx + bottomRx, baseY);
    ctx.quadraticCurveTo(cx + bodyRx, baseY, cx + bodyRx, baseY - cornerR);
    ctx.lineTo(cx + bodyRx, topY);
    ctx.closePath();
    ctx.clip();
    var bodyHL = ctx.createLinearGradient(cx - bodyW * 0.3, 0, cx + bodyW * 0.2, 0);
    bodyHL.addColorStop(0, "rgba(255,255,255,0)");
    bodyHL.addColorStop(0.5, "rgba(190,210,255,.15)");
    bodyHL.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = bodyHL;
    ctx.fillRect(cx - bodyW / 2, topY, bodyW, bodyH);
    ctx.restore();

    // 柱身内嵌小星
    var bodyStars = [
      [0.18, 0.30, "#FFD166"], [0.30, 0.62, "#FFFFFF"], [0.72, 0.28, "#7CC4FF"],
      [0.82, 0.58, "#FF6B6B"], [0.55, 0.74, "#FF8FB1"], [0.42, 0.45, "#FFA94D"]
    ];
    bodyStars.forEach(function(s){
      drawStar(cx - bodyW / 2 + s[0] * bodyW, topY + s[1] * bodyH, w * 0.018, s[2], alpha * 0.7);
    });

    // 柱身彩色糖珠
    cakePts.forEach(function(p){
      if (p.layer !== 0) return;
      var bx = cx - bodyW / 2 + p.bx * bodyW;
      var by = topY + p.by * bodyH;
      drawPearl(bx, by, p.r, p.color, alpha * 0.6);
    });

    // 柱身底部蓝色弧光带（贴合底弧）+ 光晕
    ctx.fillStyle = "rgba(80,170,255,.30)";
    ctx.beginPath();
    ctx.moveTo(cx - bodyRx, baseY - w * 0.05);
    ctx.lineTo(cx - bodyRx, baseY);
    ctx.lineTo(cx + bodyRx, baseY);
    ctx.lineTo(cx + bodyRx, baseY - w * 0.05);
    ctx.closePath();
    ctx.fill();
    var blueGlow = ctx.createRadialGradient(cx, baseY, 1, cx, baseY, bodyW * 0.55);
    blueGlow.addColorStop(0, "rgba(90,180,255,.30)");
    blueGlow.addColorStop(1, "rgba(90,180,255,0)");
    ctx.fillStyle = blueGlow;
    ctx.beginPath();
    ctx.ellipse(cx, baseY, bodyW * 0.55, w * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // 顶面金色碎屑糖霜
    ctx.fillStyle = "#F2C14E";
    ctx.beginPath();
    ctx.ellipse(cx, topY, topRx, topRy, 0, 0, Math.PI * 2);
    ctx.fill();
    // 糖霜厚度：上沿亮边、下沿暗边
    ctx.save();
    ctx.globalAlpha = alpha * 0.5;
    ctx.strokeStyle = "rgba(255,240,200,.8)";
    ctx.lineWidth = w * 0.008;
    ctx.beginPath();
    ctx.ellipse(cx, topY, topRx, topRy, 0, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.strokeStyle = "rgba(150,100,30,.45)";
    ctx.beginPath();
    ctx.ellipse(cx, topY, topRx, topRy, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.restore();

    // 顶面奶油裱花珠边（整圈浅粉白小圆珠）
    var pipCount = 22;
    for (var pk = 0; pk < pipCount; pk++){
      var pa = (Math.PI * 2) * pk / pipCount;
      var px = cx + Math.cos(pa) * topRx;
      var py = topY + Math.sin(pa) * topRy;
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = "#FFF0F3";
      ctx.beginPath();
      ctx.arc(px, py, w * 0.014, 0, Math.PI * 2);
      ctx.fill();
    }

    // 顶面下沿奶油腰线：分隔顶面与柱身，分层更清楚
    ctx.fillStyle = "rgba(255,183,205,.28)";
    ctx.beginPath();
    ctx.ellipse(cx, topY + w * 0.012, topRx * 0.99, topRy * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    var topDots = [
      [0.22, 0.42, "#FFE9B0"], [0.40, 0.60, "#7CC4FF"], [0.58, 0.34, "#FFA94D"],
      [0.74, 0.58, "#B98CFF"], [0.33, 0.56, "#7CE8C6"], [0.52, 0.50, "#FFFFFF"],
      [0.30, 0.30, "#FFD166"], [0.66, 0.44, "#FF6B6B"], [0.45, 0.38, "#FFC2D4"],
      [0.60, 0.62, "#9BE3D0"]
    ];
    topDots.forEach(function(d){
      ctx.globalAlpha = alpha * 0.85;
      ctx.fillStyle = d[2];
      ctx.beginPath();
      ctx.ellipse(cx - topRx + d[0] * topRx * 2, topY - topRy + d[1] * topRy * 2, w * 0.045, w * 0.026, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // 顶面糖珠
    cakePts.forEach(function(p){
      if (p.layer !== 1) return;
      var bx = cx - topRx + p.bx * topRx * 2;
      var by = topY - topRy + p.by * topRy * 2;
      drawPearl(bx, by, p.r, p.color, alpha * 0.65);
    });

    // 顶面水果点缀：草莓 / 樱桃 / 橙子片，沿顶面椭圆前后排布、避开中间蜡烛
    var fruitS = w * 0.075;
    function fruitXY(u, v){
      return [cx - topRx + u * topRx * 2, topY - topRy + v * topRy * 2];
    }
    // 后排（靠后，靠近蜡烛根）
    var b1 = fruitXY(0.22, 0.33);
    drawStrawberry(b1[0], b1[1], fruitS * 0.66, alpha * 0.95);
    var b2 = fruitXY(0.50, 0.30);
    drawGrape(b2[0], b2[1], fruitS * 0.78, alpha * 0.95);
    var b3 = fruitXY(0.80, 0.34);
    drawStrawberry(b3[0], b3[1], fruitS * 0.66, alpha * 0.95);
    // 中排
    var m1 = fruitXY(0.36, 0.50);
    drawGrape(m1[0], m1[1], fruitS * 0.78, alpha * 0.95);
    var m2 = fruitXY(0.62, 0.49);
    drawOrange(m2[0], m2[1], fruitS * 0.88, alpha * 0.95);
    var m3 = fruitXY(0.88, 0.52);
    drawGrape(m3[0], m3[1], fruitS * 0.78, alpha * 0.95);
    // 前排（靠前，贴近观看者）
    var f1 = fruitXY(0.14, 0.60);
    drawStrawberry(f1[0], f1[1], fruitS * 0.7, alpha * 0.95);
    var f2 = fruitXY(0.26, 0.68);
    drawCherries(f2[0], f2[1], fruitS, alpha * 0.95);
    var f3 = fruitXY(0.68, 0.70);
    drawStrawberry(f3[0], f3[1], fruitS * 0.7, alpha * 0.95);

    // 三根错落蜡烛：中高侧低，三色交替，火焰各自摇曳
    var candleDefs = [
      { dx: -0.13, h: 0.12, color: "#FF8FB1", phase: 0.0 },
      { dx:  0.00, h: 0.15, color: "#F2C14E", phase: 1.4 },
      { dx:  0.13, h: 0.12, color: "#7CC4FF", phase: 2.7 }
    ];
    var candleTop = topY - candleDefs[1].h * w; // 中间蜡烛顶，供上方火花使用
    ctx.globalAlpha = alpha;
    candleDefs.forEach(function(cd){
      var c2x = cx + cd.dx * w;
      var cH = cd.h * w;
      var cTop = topY - cH;
      var cw = w * 0.028;
      // 烛身
      ctx.fillStyle = cd.color;
      ctx.fillRect(c2x - cw / 2, cTop, cw, cH);
      // 烛身细竖条纹
      ctx.fillStyle = "rgba(0,0,0,.10)";
      ctx.fillRect(c2x - cw * 0.18, cTop, cw * 0.12, cH);
      ctx.fillRect(c2x + cw * 0.10, cTop, cw * 0.12, cH);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(c2x - cw / 2, cTop, cw * 0.32, cH);
      // 顶部融化蜡滴
      ctx.beginPath();
      ctx.arc(c2x - cw / 2, cTop + w * 0.006, w * 0.006, 0, Math.PI * 2);
      ctx.arc(c2x + cw / 2, cTop + w * 0.006, w * 0.006, 0, Math.PI * 2);
      ctx.fill();
      // 晃动火焰（白核心 + 金黄中层 + 橙色光晕，带摇曳与脉动）
      var fx = c2x + Math.sin(t * 3 + cd.phase) * w * 0.008;
      var fy = cTop - w * 0.035 + Math.sin(t * 5 + cd.phase) * w * 0.004;
      var fr = w * 0.04;
      var flick = 1 + 0.08 * Math.sin(t * 7 + cd.phase);
      var flamePulse = 1 + 0.1 * Math.sin(t * 6 + cd.phase);
      var grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, fr * 2.2 * flamePulse);
      grad.addColorStop(0, "#FFF6D8");
      grad.addColorStop(0.45, "#FFD166");
      grad.addColorStop(1, "rgba(255,120,60,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(fx, fy, fr * 0.72 * flick, fr * 1.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#FFE9A8";
      ctx.beginPath();
      ctx.arc(fx, fy, fr * 0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#FFFBEF";
      ctx.beginPath();
      ctx.arc(fx, fy, fr * 0.2, 0, Math.PI * 2);
      ctx.fill();
    });

    // 柱身英文小字
    ctx.save();
    ctx.globalAlpha = alpha * 0.95;
    var txtY = topY + bodyH * 0.62;
    ctx.fillStyle = "#FFFFFF";
    ctx.font = (w * 0.05) + "px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.strokeStyle = "rgba(10,16,38,.55)";
    ctx.lineWidth = 1.2;
    ctx.strokeText("happy birthday", cx, txtY);
    ctx.fillText("happy birthday", cx, txtY);
    ctx.restore();

    ctx.restore();

    // 外围主圆环 + 左侧平行弧线笔触
    ctx.save();
    ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = "rgba(245,200,110,.65)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, midY, w * 0.70, w * 0.34, 0, 0, Math.PI * 2);
    ctx.stroke();
    for (var a = 0; a < 3; a++){
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.06, midY, w * (0.62 - 0.05 * a), w * (0.30 - 0.03 * a), -0.12, Math.PI * 0.55, Math.PI * 1.05);
      ctx.stroke();
    }
    ctx.restore();

    // 周围环绕的彩色五角星（带柔光光晕）
    cakeStars.forEach(function(s){
      var sang = s.ang + (reduced ? 0 : t * 0.05);
      var sx = cx + Math.cos(sang) * w * s.rad;
      var sy = midY + Math.sin(sang) * w * s.rad * 0.7;
      var tw = 0.6 + 0.4 * Math.sin(s.phase + t * 2);
      var depth = 1 - (s.rad - 0.52) / 0.30 * 0.25;
      var sz = s.big ? s.size * 1.35 : s.size;
      ctx.save();
      ctx.globalAlpha = alpha * tw * depth * 0.22;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(sx, sy, sz * 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      drawStar(sx, sy, sz, s.color, alpha * tw * depth);
    });

    // 火焰上方金色火花
    sparks.forEach(function(sp){
      var sx = cx + (sp.x - 0.5) * w * 0.5 + Math.sin(sp.phase + t * 2) * w * 0.012;
      var sy = candleTop - sp.y * w * 0.55;
      var tw = 0.4 + 0.6 * Math.abs(Math.sin(sp.phase + t * 3));
      ctx.save();
      ctx.globalAlpha = alpha * tw;
      ctx.fillStyle = "#FFE9A8";
      ctx.beginPath();
      ctx.arc(sx, sy, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  /* ================= 满屏祝福弹窗 ================= */
  var popLayer = document.getElementById("popups");
  var lastPop = 0;

  function spawnPopup(){
    var el = document.createElement("div");
    el.className = "pop";
    el.textContent = BLESSINGS[(Math.random() * BLESSINGS.length) | 0];
    el.style.background = POP_COLORS[(Math.random() * POP_COLORS.length) | 0];
    if (isNarrow){
      el.style.top = (34 + Math.random() * 38) + "%";
      var leftSide = Math.random() < 0.5;
      if (leftSide){ el.style.left = (3 + Math.random() * 10) + "%"; }
      else { el.style.right = (3 + Math.random() * 10) + "%"; }
    } else {
      el.style.top = (38 + Math.random() * 44) + "%";
      var leftSide2 = Math.random() < 0.5;
      if (leftSide2){ el.style.left = (5 + Math.random() * 16) + "%"; }
      else { el.style.right = (5 + Math.random() * 16) + "%"; }
    }
    popLayer.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("in", "float"); });
    popCards.push({ el: el, born: performance.now(), life: 11000 + Math.random() * 4000 });
  }

  function clearPopups(){
    popCards.forEach(function(c){ c.el.remove(); });
    popCards = [];
    lastPop = 0;
  }

  function updatePopups(now, heartP){
    // 窄屏不显示满屏祝福弹窗，仅宽屏出现
    if (isNarrow){
      if (popCards.length) clearPopups();
      return;
    }
    var popLimit = 22;
    if (!reduced && heartP > 0.85 && popCards.length < popLimit){
      if (now - lastPop > 350){ lastPop = now; spawnPopup(); }
    }
    for (var i = popCards.length - 1; i >= 0; i--){
      var c = popCards[i];
      if (now - c.born > c.life){
        c.el.classList.remove("in");
        var el = c.el;
        setTimeout(function(){ el.remove(); }, 400);
        popCards.splice(i, 1);
      }
    }
  }

  /* ================= 庆祝烟花 ================= */
  function pickFwKind(){ return Math.random() < 0.3 ? "heart" : "sphere"; }
  function spawnFirework(ox, oy, big, kind){
    kind = kind || "sphere";
    var n = big ? (isNarrow ? 26 : 34) : (isNarrow ? 16 : 22);
    var col = SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0];
    var col2 = SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0];
    var heart = kind === "heart";
    for (var i = 0; i < n; i++){
      var ang = (i / n) * Math.PI * 2 + Math.random() * 0.2;
      var sp = (big ? 1.4 : 1.0) + Math.random() * 2.2;
      var vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp;
      var color, life = 900 + Math.random() * 700;
      if (heart){
        var th = (i / n) * Math.PI * 2;
        var hs = Math.sin(th);
        var hx = 16 * hs * hs * hs;
        var hy = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
        var sc = (big ? 0.16 : 0.12) * (0.9 + Math.random() * 0.25);
        vx = hx * sc; vy = -hy * sc;
        color = Math.random() < 0.3 ? "#FFFFFF" : HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0];
        life = 1100 + Math.random() * 600;
      } else {
        color = Math.random() < 0.35 ? "#FFFFFF" : (Math.random() < 0.5 ? col : col2);
      }
      fireworks.push({
        x: ox, y: oy, px: ox, py: oy,
        vx: vx, vy: vy,
        size: 1.6 + Math.random() * 2.2,
        color: color,
        born: performance.now(), life: life,
        phase: Math.random() * Math.PI * 2,
        kind: kind
      });
    }
  }
  function launchRocket(){
    var tx = W * (0.15 + Math.random() * 0.7);
    var ty = H * (0.14 + Math.random() * 0.28);
    rockets.push({
      x: tx, y: H * 0.86, ty: ty,
      vy: -(H * 0.012) * (0.9 + Math.random() * 0.4),
      kind: pickFwKind(), big: Math.random() < 0.5,
      born: performance.now()
    });
  }
  function burstFireworks(){
    if (reduced) return;
    var shots = isNarrow ? 2 : 3;
    for (var s = 0; s < shots; s++){
      var ox = W * (0.2 + Math.random() * 0.6);
      var oy = H * (0.16 + Math.random() * 0.26);
      spawnFirework(ox, oy, true, pickFwKind());
    }
  }

  /* ================= 背景音乐：本地音频循环播放 ================= */
  var bgmEl = document.getElementById("bgm");
  var audioOk = true;
  if (bgmEl){
    bgmEl.volume = 0.75;
    bgmEl.addEventListener("error", function(){ audioOk = false; });
  }
  var hintEl = document.getElementById("musicHint");
  function showMusicHint(){ if (hintEl) hintEl.classList.add("show"); }
  function hideMusicHint(){ if (hintEl) hintEl.classList.remove("show"); }
  var Music = {
    audio: bgmEl,
    playing: false,
    _play: function(){
      if (!this.audio || !audioOk) return;
      var self = this;
      var p = this.audio.play();
      if (p && p.then){
        p.then(function(){ self.playing = true; hideMusicHint(); })
         .catch(function(err){
           self.playing = false;
           if (err && err.name === "NotAllowedError") showMusicHint();
         });
      } else {
        self.playing = true; hideMusicHint();
      }
    },
    start: function(){ this._play(); },
    stop: function(){
      this.playing = false;
      if (this.audio){ this.audio.pause(); }
    },
    replay: function(){
      if (!this.audio || !audioOk) return;
      this.audio.currentTime = 0;
      this._play();
    }
  };

  /* ================= 主循环 ================= */
  var start = performance.now();
  var paused = false, hiddenAt = 0;
  var greetingEl = document.getElementById("greeting");
  var nameEl = document.getElementById("nameLine");
  var subEl = document.getElementById("subtitle");

  nameEl.textContent = NAME;
  subEl.textContent = SUBTITLE;

  function frame(now){
    if (paused) return;
    var t = reduced ? 99 : (now - start) / 1000;
    ctx.clearRect(0, 0, W, H);

    // 背景星云柔光斑（最底层，缓慢漂移呼吸）
    nebulae.forEach(function(n){
      var nx = (n.x + Math.sin(t * 0.12 + n.phase) * n.drift) * W;
      var ny = (n.y + Math.cos(t * 0.10 + n.phase) * n.drift) * H;
      var nr = n.r * Math.min(W, H);
      var breathe = reduced ? 0.10 : 0.10 + 0.04 * Math.sin(t * 0.6 + n.phase);
      var g = ctx.createRadialGradient(nx, ny, 1, nx, ny, nr);
      g.addColorStop(0, "rgba(" + n.color + "," + breathe + ")");
      g.addColorStop(1, "rgba(" + n.color + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(nx, ny, nr, 0, Math.PI * 2);
      ctx.fill();
    });

    // 背景对角柔光束（仅宽屏，低透明度氛围光，不抢主体）
    if (!isNarrow){
      var beamDefs = [
        { x: 0.22, y: 0.26, rot: -0.5, color: "150,110,200", a: 0.07 },
        { x: 0.82, y: 0.78, rot:  0.5, color: "80,110,190",  a: 0.06 }
      ];
      beamDefs.forEach(function(b){
        ctx.save();
        ctx.translate(b.x * W, b.y * H);
        ctx.rotate(b.rot);
        ctx.scale(0.45, 1);
        var br = Math.min(W, H) * 0.42;
        var bg = ctx.createRadialGradient(0, 0, 1, 0, 0, br);
        bg.addColorStop(0, "rgba(" + b.color + "," + b.a + ")");
        bg.addColorStop(1, "rgba(" + b.color + ",0)");
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(0, 0, br, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    stars.forEach(function(s){
      if (!reduced){
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0) s.x += 1; if (s.x > 1) s.x -= 1;
        if (s.y < 0) s.y += 1; if (s.y > 1) s.y -= 1;
      }
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(s.phase + t * s.speed));
      var sx = s.x * W, sy = s.y * H;
      ctx.globalAlpha = tw * (s.near ? 0.9 : 0.55);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.near){
        ctx.globalAlpha = tw * 0.45;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 1;
        var L = s.r * 2.4;
        ctx.beginPath();
        ctx.moveTo(sx - L, sy); ctx.lineTo(sx + L, sy);
        ctx.moveTo(sx, sy - L); ctx.lineTo(sx, sy + L);
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    // 偶发流星：右上向左下斜划，带细尾
    if (!reduced && now - lastMeteor > nextMeteor){
      lastMeteor = now;
      nextMeteor = 4000 + Math.random() * 4000;
      meteors.push({
        x: W * (0.35 + Math.random() * 0.6),
        y: H * (0.05 + Math.random() * 0.22),
        vx: -(0.004 + Math.random() * 0.003) * W,
        vy: (0.0025 + Math.random() * 0.002) * W,
        born: now, life: 900 + Math.random() * 400
      });
    }
    for (var mi = meteors.length - 1; mi >= 0; mi--){
      var mt = meteors[mi];
      var mage = (now - mt.born) / 1000, mlife = mt.life / 1000;
      if (mage > mlife){ meteors.splice(mi, 1); continue; }
      if (!reduced){ mt.x += mt.vx; mt.y += mt.vy; }
      var mk = 1 - mage / mlife;
      var tx = mt.x - mt.vx * 14, ty = mt.y - mt.vy * 14;
      ctx.save();
      var mg = ctx.createLinearGradient(mt.x, mt.y, tx, ty);
      mg.addColorStop(0, "rgba(255,255,255," + (0.9 * mk) + ")");
      mg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = mg; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(mt.x, mt.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.globalAlpha = mk; ctx.fillStyle = "#FFFFFF";
      ctx.beginPath(); ctx.arc(mt.x, mt.y, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    balloons.forEach(function(b){
      if (!reduced){
        b.y -= b.vy / 100;
        if (b.y < -0.15){ b.y = 1.1; b.x = balloonX(); }
      }
      drawBalloon(b, t);
    });

    var heartP = reduced ? 1 : clamp((t - 1.2) / 2.4, 0, 1);
    var cakeA  = reduced ? 1 : clamp((t - 3.2) / 1.0, 0, 1);
    var cakeLift = reduced ? 0 : (1 - easeOutCubic(cakeA)) * 40;
    var breath = reduced ? 1 : 1 + 0.02 * Math.sin(t * (Math.PI * 2 / 2.4));

    var grown = Math.floor(heartP * heartPts.length);
    heartPts.forEach(function(p, i){
      if (i >= grown) return;
      var born = i / heartPts.length;
      var local = clamp((heartP - born) / (1 / heartPts.length + 0.001), 0, 1);
      var pop = clamp(reduced ? 1 : easeOutBack(local), 0, 1);
      var px = layout.ccx + (p.rx * layout.scale) * breath;
      var py = layout.ccy - (p.ry * layout.scale) * breath;
      var sway = reduced ? 0 : Math.sin(p.phase + t * 2.2) * p.size * 0.06;
      px += sway;
      var pulse = reduced ? 1 : 1 + 0.05 * Math.sin(p.phase + t * 2.6) + 0.025 * Math.sin(p.phase + t * 5.2 + 1.2);
      drawHeart(px, py, p.size * pop * pulse, p.color, 0.92 * pop);
    });

    tags.forEach(function(g, idx){
      if (heartP < 0.6) return;
      var gang = g.ang + (reduced ? 0 : t * 0.02);
      var radMul = isNarrow ? 0.92 : 1.0;
      var rx = layout.scale * 16 * g.rad * radMul * breath;
      var ry = layout.scale * 12 * g.rad * radMul * breath;
      var gx = layout.ccx + Math.cos(gang) * rx;
      var gy = layout.ccy - Math.sin(gang) * ry;
      // 窄屏限制左右边距，避免文字被屏幕边缘裁切
      if (isNarrow){ gx = clamp(gx, 30, W - 30); }
      var align = "center";
      var floatY = reduced ? 0 : Math.sin(g.phase + t * 1.2) * 6;
      ctx.save();
      ctx.globalAlpha = 0.75 * easeOutCubic(heartP);
      ctx.font = (isNarrow ? 11 : 13) + "px 'Microsoft YaHei', sans-serif";
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(20,10,30,.65)";
      ctx.strokeText(g.text, gx, gy + floatY);
      ctx.fillStyle = "#FFD9E6";
      ctx.fillText(g.text, gx, gy + floatY);
      ctx.restore();
    });

    // 火花上升回收
    if (!reduced){
      sparks.forEach(function(sp){
        sp.y -= sp.vy / 100;
        if (sp.y < 0){ sp.y = 1; sp.x = 0.5 + (Math.random() - 0.5) * 0.16; }
      });
    }

    if (cakeA > 0){
      drawCake(t, easeOutCubic(cakeA), cakeLift);
    }

    floaters.forEach(function(f){
      if (!reduced){
        f.y -= f.vy / 100;
        if (f.y < -0.05){ f.y = 1.05; f.x = Math.random(); }
      }
      var fx = f.x * W + Math.sin(f.phase + t) * 14;
      var fy = f.y * H;
      if (f.kind === "heart"){
        drawHeart(fx, fy, f.size, f.color, 0.6);
      } else {
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(fx, fy, f.size * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    });

    // 飘落庆典彩屑
    confetti.forEach(function(c){
      if (!reduced){
        c.y -= c.vy / 100;
        c.rot += c.vrot;
        if (c.y < -0.05){ c.y = 1.05; c.x = Math.random(); }
      }
      var ccx = c.x * W + Math.sin(c.phase + t * 1.4) * c.sway;
      var ccy = c.y * H;
      ctx.save();
      ctx.translate(ccx, ccy);
      ctx.rotate(c.rot);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = c.color;
      if (c.shape === 0){
        ctx.fillRect(-c.size / 2, -c.size / 3, c.size, c.size * 0.66);
      } else if (c.shape === 1){
        ctx.beginPath(); ctx.arc(0, 0, c.size * 0.4, 0, Math.PI * 2); ctx.fill();
      } else {
        drawStar(0, 0, c.size * 0.6, c.color, 0.75);
      }
      ctx.restore();
    });

    // 升空火箭：升到高点后爆开
    for (var ri = rockets.length - 1; ri >= 0; ri--){
      var rk = rockets[ri];
      rk.y += rk.vy;
      ctx.save();
      ctx.globalAlpha = 0.85; ctx.fillStyle = "#FFE9A8";
      ctx.beginPath(); ctx.arc(rk.x, rk.y, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (rk.y <= rk.ty){
        rockets.splice(ri, 1);
        spawnFirework(rk.x, rk.ty, rk.big, rk.kind);
      }
    }

    // 庆祝烟花：重力下坠 + 阻尼 + 渐隐
    for (var fi = fireworks.length - 1; fi >= 0; fi--){
      var fw = fireworks[fi];
      var fage = (now - fw.born) / 1000;
      var flife = fw.life / 1000;
      if (fage > flife){ fireworks.splice(fi, 1); continue; }
      fw.px = fw.x; fw.py = fw.y;
      fw.vy += 0.035;
      fw.vx *= 0.985; fw.vy *= 0.985;
      fw.x += fw.vx; fw.y += fw.vy;
      var fk = 1 - fage / flife;
      ctx.save();
      // 柔光外圈
      ctx.globalAlpha = fk * 0.35;
      ctx.fillStyle = fw.color;
      ctx.beginPath();
      ctx.arc(fw.x, fw.y, Math.max(fw.size * fk * 2.4, 0.5), 0, Math.PI * 2);
      ctx.fill();
      // 实心亮点
      ctx.globalAlpha = fk;
      ctx.beginPath();
      ctx.arc(fw.x, fw.y, Math.max(fw.size * fk, 0.4), 0, Math.PI * 2);
      ctx.fill();
      // 短拖尾
      ctx.globalAlpha = fk * 0.6;
      ctx.strokeStyle = fw.color;
      ctx.lineWidth = Math.max(fw.size * fk * 0.8, 0.4);
      ctx.beginPath();
      ctx.moveTo(fw.px, fw.py);
      ctx.lineTo(fw.x, fw.y);
      ctx.stroke();
      ctx.restore();
    }

    // 点按迸发的小爱心
    for (var i = tapHearts.length - 1; i >= 0; i--){
      var h = tapHearts[i];
      var age = (now - h.born) / 1000;
      if (age > h.life){ tapHearts.splice(i, 1); continue; }
      var k = age / h.life;
      var hy = h.y - k * 60;
      var hx = h.x + Math.sin(h.phase + age * 3) * 10;
      drawHeart(hx, hy, h.size * (1 - k * 0.4), h.color, 0.85 * (1 - k));
    }

    // 点按扩散涟漪（双环）
    for (var ri = ripples.length - 1; ri >= 0; ri--){
      var rp = ripples[ri];
      var rage = (now - rp.born) / 1000, rlife = rp.life / 1000;
      if (rage > rlife){ ripples.splice(ri, 1); continue; }
      var rk = rage / rlife;
      var rr = rp.size * (0.3 + rk * 1.8);
      ctx.save();
      ctx.globalAlpha = (1 - rk) * 0.6;
      ctx.strokeStyle = rp.color; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = (1 - rk) * 0.35;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rr * 0.6, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    updatePopups(now, heartP);

    if (!reduced){
      if (t > 4.6 && fwWave === 0){ fwWave = 1; fwFired = true; burstFireworks(); }
      else if (t > 8.5 && fwWave === 1){ fwWave = 2; burstFireworks(); }
      // 开场两波之后，每隔较短时间发射一枚升空火箭，到高点再爆开
      if (t > 9 && now - lastAutoFw > nextAutoFw){
        lastAutoFw = now;
        nextAutoFw = 1800 + Math.random() * 1400;
        launchRocket();
      }
    }

    if (t > 4.2 && !greetingEl.classList.contains("show")){
      greetingEl.classList.add("show");
    }

    requestAnimationFrame(frame);
  }

  /* ================= 交互 ================= */
  document.getElementById("btnReplay").addEventListener("click", function(){
    start = performance.now();
    greetingEl.classList.remove("show");
    clearPopups();
    fwWave = 0; fwFired = false; fireworks.length = 0;
    lastAutoFw = 0; nextAutoFw = 4200;
    rockets.length = 0; meteors.length = 0; ripples.length = 0;
    lastMeteor = 0; nextMeteor = 3000;
    if (musicOn){ Music.replay(); }
  });

  var musicOn = true;
  var btnMusic = document.getElementById("btnMusic");
  btnMusic.addEventListener("click", function(){
    musicOn = !musicOn;
    if (musicOn){
      Music.start();
      btnMusic.textContent = "音乐 开";
    } else {
      Music.stop();
      hideMusicHint();
      btnMusic.textContent = "音乐 关";
    }
  });

  // 默认开启：受浏览器自动播放限制，首次点击 / 触摸 / 按键时解锁发声
  var unlockEvents = ["pointerdown", "touchstart", "touchend", "mousedown", "click", "keydown", "gesturestart"];
  function unlockMusic(){
    if (!musicOn || Music.playing) return;
    Music.start();
  }
  unlockEvents.forEach(function(ev){
    document.addEventListener(ev, unlockMusic, { passive: true });
  });

  // 点按屏幕迸发小爱心（按钮区除外）
  function spawnTapHeart(x, y){
    if (tapHearts.length >= 12) tapHearts.shift();
    tapHearts.push({
      x: x, y: y,
      size: 8 + Math.random() * 7,
      color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0],
      phase: Math.random() * Math.PI * 2,
      born: performance.now(), life: 1.2 + Math.random() * 0.6
    });
  }
  function spawnRipple(x, y){
    if (ripples.length >= 10) ripples.shift();
    ripples.push({
      x: x, y: y, size: 10,
      color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0],
      born: performance.now(), life: 0.7
    });
  }
  document.addEventListener("pointerdown", function(e){
    if (e.target && e.target.closest && e.target.closest(".controls")) return;
    spawnTapHeart(e.clientX, e.clientY);
    spawnRipple(e.clientX, e.clientY);
  });

  var btnFull = document.getElementById("btnFull");
  btnFull.addEventListener("click", function(){
    if (document.fullscreenElement){
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
  });

  window.addEventListener("resize", resize);

  // 页面切到后台时暂停动画循环省电，回到前台继续并校正时间基准
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){
      paused = true; hiddenAt = performance.now();
    } else {
      start += performance.now() - hiddenAt;
      paused = false;
      if (musicOn && bgmEl && bgmEl.paused) Music.start();
      requestAnimationFrame(frame);
    }
  });

  buildStatic();
  resize();
  try { Music.start(); } catch (e) {}
  // 音频缓冲就绪后若仍未播放，再自动尝试一次
  if (bgmEl){
    ["loadeddata", "canplaythrough"].forEach(function(ev){
      bgmEl.addEventListener(ev, function(){
        if (musicOn && bgmEl.paused) Music.start();
      });
    });
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
